[package]
authors.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
name = "dbt-sa-cli"
repository.workspace = true
version.workspace = true

[lints]
workspace = true

# `cargo binstall --git https://github.com/athvin/dbt dbt-sa-cli` installs the
# prebuilt DuckFleet `dbt` from the latest duckfleet-v* release rather than
# compiling (athvin/duck-fleet#215). The release tags are not the crate version,
# so each target points at the latest release's tarball by name.
[package.metadata.binstall]
pkg-fmt = "tgz"
bin-dir = "dbt{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "https://github.com/athvin/dbt/releases/latest/download/dbt-linux-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "https://github.com/athvin/dbt/releases/latest/download/dbt-linux-aarch64.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "https://github.com/athvin/dbt/releases/latest/download/dbt-darwin-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "https://github.com/athvin/dbt/releases/latest/download/dbt-darwin-aarch64.tar.gz"

[dependencies]
dbt-clap-core = { workspace = true }
dbt-common = { workspace = true }
dbt-features = { workspace = true }
dbt-fusion-workspace-hack = { version = "0.1" }
dbt-main = { workspace = true }

[features]
default = ["embed-ui"]
embed-ui = ["dbt-main/embed-ui"]

[dev-dependencies]
dbt-runtime = { workspace = true }
dbt-test-primitives = { workspace = true }
dbt-test-utils = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[[bin]]
doctest = false
name = "dbt"
path = "src/main.rs"
