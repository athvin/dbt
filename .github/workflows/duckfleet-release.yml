name: duckfleet-release

# Builds the `dbt` binary (dbt-sa-cli -> dbt-main -> dbt-compilation/dbt-adapter,
# so the DuckFleet adapter is compiled in) and publishes it so DuckFleet's own
# CI and dbt fixture can download a pinned, prebuilt binary instead of
# compiling dbt-core (~45 min) themselves.
#
# Trigger manually (workflow_dispatch) for a throwaway artifact, or push a
# `duckfleet-v*` tag to cut a GitHub Release with the binary attached.
#
# A tag also publishes every install path, with no manual step (athvin/duck-fleet#215):
# the four tarballs with build-provenance attestations, a combined SHA256SUMS,
# `dbt-installer.sh` (curl | sh), and Formula/dbt-duckfleet.rb pushed to
# athvin/homebrew-duckfleet. `cargo binstall` reads the tarballs through the
# metadata in crates/dbt-sa-cli/Cargo.toml. The asset names are unchanged, because
# athvin/duck-fleet's docker/dbt.Dockerfile downloads them by name.

on:
  workflow_dispatch:
  push:
    tags:
      - 'duckfleet-v*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: duckfleet-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
          # Native macOS builds, so dbt installs with Homebrew and runs directly
          # on a developer's machine rather than inside a Linux container.
          - os: darwin
            arch: aarch64
            runner: macos-latest
          - os: darwin
            arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      # The workspace pins arrow/datafusion/ring to sdf-labs git forks; fetch
      # them with the git CLI so credentials/proxies behave on the runner.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # dbt-state's build script compiles the query-cache .proto files via
      # prost-build, which shells out to `protoc`. It is the only native build
      # tool the workspace needs (no cmake; rustls uses ring, not aws-lc).
      - name: Install protoc (Linux)
        if: matrix.os == 'linux'
        # protobuf-compiler ships the `protoc` binary; libprotobuf-dev ships the
        # well-known-type .proto files (google/protobuf/*.proto) under /usr/include
        # that dbt-state's protos import — protoc finds them on its default include path.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - name: Install protoc (macOS)
        if: matrix.os == 'darwin'
        # Homebrew's protobuf carries both protoc and the well-known-type protos.
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for this workflow; the arrow/datafusion forks dominate the
          # build, so sharing across runs turns the ~45 min cold build into minutes.
          shared-key: duckfleet-release-${{ matrix.os }}-${{ matrix.arch }}

      - name: Build dbt (release)
        run: cargo build --release --locked --bin dbt

      - name: Package
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist
          strip target/release/dbt
          "target/release/dbt" --version > dist/dbt.version || echo "unknown" > dist/dbt.version
          name="dbt-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar -C target/release -czf "dist/$name" dbt
          # sha256sum on Linux, shasum on macOS; both write the same `<hash>  <file>` line.
          ( cd dist && if command -v sha256sum > /dev/null; then sha256sum "$name"; else shasum -a 256 "$name"; fi > "$name.sha256" )
          ls -l dist

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/dbt-${{ matrix.os }}-${{ matrix.arch }}.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dbt-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            dist/dbt-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256

  # Everything that needs all four builds: the combined checksums, the installer,
  # and the Homebrew formula. Tags only.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and installer
        run: |
          set -euo pipefail
          cd dist
          sha256sum dbt-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
          sed "s/@DBT_RELEASE_TAG@/${GITHUB_REF_NAME}/" ../scripts/duckfleet/install.sh > dbt-installer.sh
          sh -n dbt-installer.sh

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SHA256SUMS
            dist/dbt-installer.sh

      # A deploy key that can write only to the tap. The tap is a separate
      # repository, which GITHUB_TOKEN cannot push to.
      - name: Push the Homebrew formula
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$TAP_KEY" || { echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set"; exit 1; }
          mkdir -p ~/.ssh && printf '%s\n' "$TAP_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:athvin/homebrew-duckfleet.git tap
          sh scripts/duckfleet/formula.sh "$GITHUB_REF_NAME" dist/SHA256SUMS > tap/Formula/dbt-duckfleet.rb
          cd tap
          if git diff --quiet; then echo "formula already current"; exit 0; fi
          git -c user.name="duckfleet-release" -c user.email="duckfleet-release@users.noreply.github.com" \
            commit -am "dbt-duckfleet ${GITHUB_REF_NAME#duckfleet-v}"
          git push origin HEAD

